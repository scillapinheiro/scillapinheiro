name: Atualizar cards

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Gerar cards
        env:
          # Com o token padrão entram só as contribuições públicas.
          # Para contar também as privadas, crie um token com a permissão read:user
          # e salve como secret PROFILE_TOKEN.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: node scripts/generate-cards.mjs

      - name: Salvar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/languages.svg assets/activity.svg
          git diff --cached --quiet || git commit -m "chore: atualizar cards"
          git push
